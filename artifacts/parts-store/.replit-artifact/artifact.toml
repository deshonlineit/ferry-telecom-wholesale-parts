kind = "web"
previewPath = "/"
title = "Ferry Telecom — PHP testomgeving"
version = "1.0.0"
id = "artifacts/parts-store"
router = "path"

[[services]]
name = "native"
paths = [ "/" ]
localPort = 18411

[services.development]
run = "bash native/bin/start.sh"

[services.production]
build = ["bash", "artifacts/parts-store/native/bin/build-production.sh"]
run = "bash artifacts/parts-store/native/bin/start-production.sh"

[services.production.health.startup]
path = "/test-shop/ready"

[services.env]
PORT = "18411"
BASE_PATH = "/test-shop/"
SHOP_MODE = "preview"