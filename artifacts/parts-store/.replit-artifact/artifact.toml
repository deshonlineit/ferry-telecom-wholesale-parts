kind = "web"
previewPath = "/test-shop/"
title = "Ferry Telecom — PHP testomgeving"
version = "1.0.0"
id = "artifacts/parts-store"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18409

[services.development]
run = "pnpm --filter @workspace/parts-store run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/parts-store", "run", "build" ]
serve = "static"
publicDir = "artifacts/parts-store/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18409"
BASE_PATH = "/"

[[services]]
name = "native"
paths = [ "/test-shop" ]
localPort = 18411

[services.development]
run = "bash native/bin/start.sh"

[services.production]
build = ["php", "native/bin/not-publishable.php"]
run = "php native/bin/not-publishable.php"

[services.env]
PORT = "18411"
BASE_PATH = "/test-shop/"