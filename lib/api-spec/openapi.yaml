openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Wholesale mobile parts store API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: catalog
  - name: products
  - name: account
  - name: cart
  - name: orders
  - name: storage
  - name: admin
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /catalog/categories:
    get:
      operationId: listCategories
      tags: [catalog]
      summary: List product categories with product counts
      responses:
        "200":
          description: Categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Category"
  /catalog/brands:
    get:
      operationId: listBrands
      tags: [catalog]
      summary: List device brands with their models
      responses:
        "200":
          description: Brands
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Brand"
  /catalog/summary:
    get:
      operationId: getCatalogSummary
      tags: [catalog]
      summary: Storefront summary stats (product count, brands, in-stock, categories)
      responses:
        "200":
          description: Summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogSummary"
  /products:
    get:
      operationId: listProducts
      tags: [products]
      summary: Search and filter products (prices are tier-adjusted for current customer)
      parameters:
        - name: search
          in: query
          schema: { type: string }
        - name: categoryId
          in: query
          schema: { type: integer }
        - name: brandId
          in: query
          schema: { type: integer }
        - name: modelId
          in: query
          schema: { type: integer }
        - name: quality
          in: query
          schema: { type: string }
        - name: inStockOnly
          in: query
          schema: { type: boolean }
        - name: sort
          in: query
          schema:
            type: string
            enum: [name, priceAsc, priceDesc, stockAsc, stockDesc, newest]
        - name: page
          in: query
          schema: { type: integer, minimum: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, minimum: 1, maximum: 100 }
      responses:
        "200":
          description: Paged products
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductPage"
  /products/featured:
    get:
      operationId: listFeaturedProducts
      tags: [products]
      summary: Featured / best-selling products
      responses:
        "200":
          description: Featured products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"
  /products/{id}:
    get:
      operationId: getProduct
      tags: [products]
      summary: Product detail with tier price breakdown
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Product detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductDetail"
        "404":
          description: Not found
  /products/{id}/image:
    put:
      operationId: setProductImage
      tags: [products]
      summary: Set a product's image from an uploaded object path or URL
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductImageInput"
      responses:
        "200":
          description: Updated product image
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductImageResult"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /storage/uploads/request-url:
    post:
      tags: [storage]
      operationId: requestUploadUrl
      summary: Request a presigned URL for file upload
      description: |
        Returns a presigned GCS URL for direct upload. The client sends JSON
        metadata here, then uploads the file directly to the returned URL.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadUrlRequest'
      responses:
        '200':
          description: Presigned upload URL generated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadUrlResponse'
        '400':
          description: Missing or invalid required fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Failed to generate upload URL.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /storage/public-objects/{filePath}:
    get:
      tags: [storage]
      operationId: getPublicObject
      summary: Serve a public asset from PUBLIC_OBJECT_SEARCH_PATHS
      description: |
        Unconditionally public — no authentication or ACL checks.
        Searches PUBLIC_OBJECT_SEARCH_PATHS for the given file path.
      parameters:
        - name: filePath
          in: path
          required: true
          schema:
            type: string
          description: Relative file path within the public search paths.
      responses:
        '200':
          description: Object content streamed with correct Content-Type.
          content:
            '*/*':
              schema:
                type: string
                format: binary
        '404':
          description: File not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Failed to serve public object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /storage/objects/{objectPath}:
    get:
      tags: [storage]
      operationId: getStorageObject
      summary: Serve an object entity from PRIVATE_OBJECT_DIR
      description: |
        Serves object entities uploaded via presigned URLs. These can optionally
        be protected with authentication or ACL checks based on the use case.
      parameters:
        - name: objectPath
          in: path
          required: true
          schema:
            type: string
          description: Object path within the private object dir (e.g. `uploads/some-uuid`).
      responses:
        '200':
          description: Object content streamed with correct Content-Type.
          content:
            '*/*':
              schema:
                type: string
                format: binary
        '404':
          description: Object not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Failed to serve object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /me:
    get:
      operationId: getCurrentCustomer
      tags: [account]
      summary: Current customer profile with price tier and progress to next tier
      responses:
        "200":
          description: Customer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"
    patch:
      operationId: updateCustomerProfile
      tags: [account]
      summary: Update the current customer's profile (company, contact, default shipping address)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerProfileUpdate"
      responses:
        "200":
          description: Updated customer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"
        "400":
          description: Invalid input
  /price-tiers:
    get:
      operationId: listPriceTiers
      tags: [account]
      summary: All price tiers and their discount rules
      responses:
        "200":
          description: Tiers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PriceTier"
  /cart:
    get:
      operationId: getCart
      tags: [cart]
      summary: Current cart with tier-adjusted line totals
      responses:
        "200":
          description: Cart
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cart"
    delete:
      operationId: clearCart
      tags: [cart]
      summary: Empty the cart
      responses:
        "204":
          description: Cleared
  /cart/items:
    post:
      operationId: addCartItem
      tags: [cart]
      summary: Add a product to the cart (or increase quantity)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CartItemInput"
      responses:
        "200":
          description: Updated cart
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cart"
        "400":
          description: Invalid input or insufficient stock
  /cart/items/{id}:
    patch:
      operationId: updateCartItem
      tags: [cart]
      summary: Change quantity of a cart line
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CartItemUpdate"
      responses:
        "200":
          description: Updated cart
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cart"
        "404":
          description: Not found
    delete:
      operationId: removeCartItem
      tags: [cart]
      summary: Remove a cart line
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Updated cart
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cart"
  /orders:
    get:
      operationId: listOrders
      tags: [orders]
      summary: Order history for current customer
      responses:
        "200":
          description: Orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OrderSummary"
    post:
      operationId: createOrder
      tags: [orders]
      summary: One-step checkout from current cart
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderInput"
      responses:
        "201":
          description: Created order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          description: Cart empty or stock problem
  /orders/{id}:
    get:
      operationId: getOrder
      tags: [orders]
      summary: Order detail with lines
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "404":
          description: Not found
  /search/smart:
    get:
      operationId: smartSearch
      tags: [products]
      summary: Natural-language part search ("a52 display" -> model + category matched products)
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Search result with interpretation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SmartSearchResult"
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [account]
      summary: Account dashboard (spend, orders, tier progress, recent orders)
      responses:
        "200":
          description: Dashboard
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
  /admin/products:
    get:
      operationId: adminListProducts
      tags: [admin]
      summary: Admin product list with raw list prices and stock
      parameters:
        - name: search
          in: query
          schema: { type: string }
        - name: categoryId
          in: query
          schema: { type: integer }
        - name: page
          in: query
          schema: { type: integer, minimum: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, minimum: 1, maximum: 100 }
      responses:
        "200":
          description: Paged admin products
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminProductPage"
    post:
      operationId: adminCreateProduct
      tags: [admin]
      summary: Create a product
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductInput"
      responses:
        "201":
          description: Created product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminProduct"
        "400":
          description: Invalid input or duplicate SKU
  /admin/products/{id}:
    patch:
      operationId: adminUpdateProduct
      tags: [admin]
      summary: Update a product (partial)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductPatch"
      responses:
        "200":
          description: Updated product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminProduct"
        "404":
          description: Not found
        "400":
          description: Invalid input
  /admin/categories:
    post:
      operationId: adminCreateCategory
      tags: [admin]
      summary: Create a category
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryInput"
      responses:
        "201":
          description: Created category
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
        "400":
          description: Invalid input or duplicate slug
  /admin/categories/{id}:
    patch:
      operationId: adminUpdateCategory
      tags: [admin]
      summary: Update a category
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryPatch"
      responses:
        "200":
          description: Updated category
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
        "404":
          description: Not found
  /admin/brands:
    post:
      operationId: adminCreateBrand
      tags: [admin]
      summary: Create a brand
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BrandInput"
      responses:
        "201":
          description: Created brand
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Brand"
        "400":
          description: Invalid input or duplicate name
  /admin/models:
    post:
      operationId: adminCreateModel
      tags: [admin]
      summary: Create a device model under a brand
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceModelInput"
      responses:
        "201":
          description: Created model
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceModel"
        "400":
          description: Invalid input
  /admin/customers:
    get:
      operationId: adminListCustomers
      tags: [admin]
      summary: All customers with their price tier
      responses:
        "200":
          description: Customers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminCustomer"
  /admin/customers/{id}:
    patch:
      operationId: adminUpdateCustomerTier
      tags: [admin]
      summary: Assign a customer to a price tier
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerTierAssignment"
      responses:
        "200":
          description: Updated customer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminCustomer"
        "404":
          description: Not found
        "400":
          description: Invalid tier
  /admin/orders:
    get:
      operationId: adminListOrders
      tags: [admin]
      summary: All orders across customers
      responses:
        "200":
          description: Orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminOrder"
  /admin/orders/{id}:
    patch:
      operationId: adminUpdateOrderStatus
      tags: [admin]
      summary: Update order status (processing → shipped → delivered)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderStatusUpdate"
      responses:
        "200":
          description: Updated order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminOrder"
        "404":
          description: Not found
        "400":
          description: Invalid status
components:
  schemas:
    AdminProduct:
      type: object
      required: [id, sku, name, categoryId, categoryName, brandId, brandName, quality, listPrice, stock, featured, imageUrl, description]
      properties:
        id: { type: integer }
        sku: { type: string }
        name: { type: string }
        categoryId: { type: integer }
        categoryName: { type: string }
        brandId: { type: integer }
        brandName: { type: string }
        modelId: { type: ["integer", "null"] }
        modelName: { type: ["string", "null"] }
        quality: { type: string }
        listPrice: { type: number }
        stock: { type: integer }
        featured: { type: boolean }
        imageUrl: { type: ["string", "null"] }
        description: { type: ["string", "null"] }
    AdminProductPage:
      type: object
      required: [items, total, page, pageSize, totalPages]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AdminProduct"
        total: { type: integer }
        page: { type: integer }
        pageSize: { type: integer }
        totalPages: { type: integer }
    ProductInput:
      type: object
      required: [sku, name, categoryId, brandId, quality, listPrice, stock]
      properties:
        sku: { type: string, minLength: 1 }
        name: { type: string, minLength: 1 }
        categoryId: { type: integer }
        brandId: { type: integer }
        modelId: { type: ["integer", "null"] }
        quality: { type: string, minLength: 1 }
        listPrice: { type: number, minimum: 0 }
        stock: { type: integer, minimum: 0 }
        featured: { type: boolean }
        imageUrl: { type: ["string", "null"] }
        description: { type: ["string", "null"] }
    ProductPatch:
      type: object
      properties:
        sku: { type: string, minLength: 1 }
        name: { type: string, minLength: 1 }
        categoryId: { type: integer }
        brandId: { type: integer }
        modelId: { type: ["integer", "null"] }
        quality: { type: string, minLength: 1 }
        listPrice: { type: number, minimum: 0 }
        stock: { type: integer, minimum: 0 }
        featured: { type: boolean }
        imageUrl: { type: ["string", "null"] }
        description: { type: ["string", "null"] }
    CategoryInput:
      type: object
      required: [name, slug]
      properties:
        name: { type: string, minLength: 1 }
        slug: { type: string, minLength: 1 }
        description: { type: ["string", "null"] }
    CategoryPatch:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        slug: { type: string, minLength: 1 }
        description: { type: ["string", "null"] }
    BrandInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1 }
    DeviceModelInput:
      type: object
      required: [brandId, name]
      properties:
        brandId: { type: integer }
        name: { type: string, minLength: 1 }
    AdminCustomer:
      type: object
      required: [id, companyName, contactName, email, tierId, tierName, annualSpend]
      properties:
        id: { type: integer }
        companyName: { type: string }
        contactName: { type: string }
        email: { type: string }
        tierId: { type: integer }
        tierName: { type: string }
        annualSpend: { type: number }
    CustomerTierAssignment:
      type: object
      required: [tierId]
      properties:
        tierId: { type: integer }
    AdminOrder:
      type: object
      required: [id, orderNumber, customerId, companyName, status, itemCount, total, createdAt]
      properties:
        id: { type: integer }
        orderNumber: { type: string }
        customerId: { type: integer }
        companyName: { type: string }
        status: { type: string }
        itemCount: { type: integer }
        total: { type: number }
        createdAt: { type: string }
    OrderStatusUpdate:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [processing, shipped, delivered]
    HealthStatus:
      type: object
      properties:
        status: { type: string }
      required: [status]
    Category:
      type: object
      required: [id, name, slug, productCount]
      properties:
        id: { type: integer }
        name: { type: string }
        slug: { type: string }
        description: { type: ["string", "null"] }
        productCount: { type: integer }
    DeviceModel:
      type: object
      required: [id, brandId, name]
      properties:
        id: { type: integer }
        brandId: { type: integer }
        name: { type: string }
    Brand:
      type: object
      required: [id, name, models]
      properties:
        id: { type: integer }
        name: { type: string }
        models:
          type: array
          items:
            $ref: "#/components/schemas/DeviceModel"
    CatalogSummary:
      type: object
      required: [productCount, brandCount, categoryCount, inStockCount]
      properties:
        productCount: { type: integer }
        brandCount: { type: integer }
        categoryCount: { type: integer }
        inStockCount: { type: integer }
    Product:
      type: object
      required: [id, sku, name, categoryId, categoryName, brandId, brandName, quality, listPrice, yourPrice, stock, imageUrl]
      properties:
        id: { type: integer }
        sku: { type: string }
        name: { type: string }
        categoryId: { type: integer }
        categoryName: { type: string }
        brandId: { type: integer }
        brandName: { type: string }
        modelId: { type: ["integer", "null"] }
        modelName: { type: ["string", "null"] }
        quality: { type: string }
        listPrice: { type: number }
        yourPrice: { type: number }
        stock: { type: integer }
        imageUrl: { type: ["string", "null"] }
        description: { type: ["string", "null"] }
    ProductPage:
      type: object
      required: [items, total, page, pageSize, totalPages]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Product"
        total: { type: integer }
        page: { type: integer }
        pageSize: { type: integer }
        totalPages: { type: integer }
    TierPrice:
      type: object
      required: [tierId, tierName, price, isCurrent]
      properties:
        tierId: { type: integer }
        tierName: { type: string }
        price: { type: number }
        isCurrent: { type: boolean }
    ProductDetail:
      allOf:
        - $ref: "#/components/schemas/Product"
        - type: object
          required: [tierPrices, specs]
          properties:
            tierPrices:
              type: array
              items:
                $ref: "#/components/schemas/TierPrice"
            specs:
              type: array
              items:
                $ref: "#/components/schemas/ProductSpec"
    ProductSpec:
      type: object
      required: [label, value]
      properties:
        label: { type: string }
        value: { type: string }
    PriceTier:
      type: object
      required: [id, name, discountPercent, minAnnualSpend, description]
      properties:
        id: { type: integer }
        name: { type: string }
        discountPercent: { type: number }
        minAnnualSpend: { type: number }
        description: { type: string }
    Customer:
      type: object
      required: [id, companyName, contactName, email, defaultShippingAddress, tier, annualSpend, nextTier]
      properties:
        id: { type: integer }
        companyName: { type: string }
        contactName: { type: string }
        email: { type: string }
        defaultShippingAddress: { type: ["string", "null"] }
        tier:
          $ref: "#/components/schemas/PriceTier"
        annualSpend: { type: number }
        nextTier:
          oneOf:
            - $ref: "#/components/schemas/NextTierProgress"
            - type: "null"
    CustomerProfileUpdate:
      type: object
      required: [companyName, contactName]
      properties:
        companyName: { type: string, minLength: 1 }
        contactName: { type: string, minLength: 1 }
        defaultShippingAddress: { type: ["string", "null"] }
    NextTierProgress:
      type: object
      required: [tier, remainingSpend, progressPercent]
      properties:
        tier:
          $ref: "#/components/schemas/PriceTier"
        remainingSpend: { type: number }
        progressPercent: { type: number }
    CartItem:
      type: object
      required: [id, productId, sku, name, quality, imageUrl, quantity, unitPrice, lineTotal, stock]
      properties:
        id: { type: integer }
        productId: { type: integer }
        sku: { type: string }
        name: { type: string }
        quality: { type: string }
        imageUrl: { type: ["string", "null"] }
        quantity: { type: integer }
        unitPrice: { type: number }
        lineTotal: { type: number }
        stock: { type: integer }
    Cart:
      type: object
      required: [items, itemCount, subtotal, discountPercent, listSubtotal, savings]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/CartItem"
        itemCount: { type: integer }
        subtotal: { type: number }
        listSubtotal: { type: number }
        savings: { type: number }
        discountPercent: { type: number }
    CartItemInput:
      type: object
      required: [productId, quantity]
      properties:
        productId: { type: integer }
        quantity: { type: integer, minimum: 1 }
    CartItemUpdate:
      type: object
      required: [quantity]
      properties:
        quantity: { type: integer, minimum: 1 }
    UploadUrlRequest:
      type: object
      required: [name, size, contentType]
      properties:
        name:
          type: string
          minLength: 1
          description: Original file name.
        size:
          type: integer
          minimum: 1
          description: File size in bytes.
        contentType:
          type: string
          minLength: 1
          description: MIME type of the file (e.g. `image/jpeg`).
    UploadUrlResponse:
      type: object
      required: [uploadURL, objectPath]
      properties:
        uploadURL:
          type: string
          format: uri
          description: Presigned GCS URL for PUT upload.
        objectPath:
          type: string
          description: Normalized object path (e.g. `/objects/uploads/uuid`). Store this in your database.
        metadata:
          $ref: '#/components/schemas/UploadUrlRequest'
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: string
    ProductImageInput:
      type: object
      required: [imageUrl]
      properties:
        imageUrl:
          type: string
          minLength: 1
          description: Uploaded objectPath (`/objects/...`), a storage URL, or any absolute image URL.
    ProductImageResult:
      type: object
      required: [id, imageUrl]
      properties:
        id: { type: integer }
        imageUrl: { type: string }
    OrderInput:
      type: object
      required: [shippingAddress]
      properties:
        shippingAddress: { type: string, minLength: 1 }
        notes: { type: string }
    OrderLine:
      type: object
      required: [id, productId, sku, name, imageUrl, quantity, unitPrice, lineTotal]
      properties:
        id: { type: integer }
        productId: { type: integer }
        sku: { type: string }
        name: { type: string }
        imageUrl: { type: ["string", "null"] }
        quantity: { type: integer }
        unitPrice: { type: number }
        lineTotal: { type: number }
    OrderSummary:
      type: object
      required: [id, orderNumber, status, itemCount, total, createdAt]
      properties:
        id: { type: integer }
        orderNumber: { type: string }
        status: { type: string }
        itemCount: { type: integer }
        total: { type: number }
        createdAt: { type: string }
    Order:
      type: object
      required: [id, orderNumber, status, total, savings, shippingAddress, createdAt, lines]
      properties:
        id: { type: integer }
        orderNumber: { type: string }
        status: { type: string }
        total: { type: number }
        savings: { type: number }
        shippingAddress: { type: string }
        notes: { type: ["string", "null"] }
        createdAt: { type: string }
        lines:
          type: array
          items:
            $ref: "#/components/schemas/OrderLine"
    SmartSearchInterpretation:
      type: object
      required: [matchedTerms]
      properties:
        brandId: { type: ["integer", "null"] }
        brandName: { type: ["string", "null"] }
        modelId: { type: ["integer", "null"] }
        modelName: { type: ["string", "null"] }
        categoryId: { type: ["integer", "null"] }
        categoryName: { type: ["string", "null"] }
        matchedTerms:
          type: array
          items: { type: string }
    SmartSearchResult:
      type: object
      required: [interpretation, products, total]
      properties:
        interpretation:
          $ref: "#/components/schemas/SmartSearchInterpretation"
        products:
          type: array
          items:
            $ref: "#/components/schemas/Product"
        total: { type: integer }
    DashboardSummary:
      type: object
      required: [totalOrders, annualSpend, totalSavings, tier, nextTier, recentOrders]
      properties:
        totalOrders: { type: integer }
        annualSpend: { type: number }
        totalSavings: { type: number }
        tier:
          $ref: "#/components/schemas/PriceTier"
        nextTier:
          oneOf:
            - $ref: "#/components/schemas/NextTierProgress"
            - type: "null"
        recentOrders:
          type: array
          items:
            $ref: "#/components/schemas/OrderSummary"
